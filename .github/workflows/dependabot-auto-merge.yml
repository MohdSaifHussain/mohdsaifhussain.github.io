# Auto-merge Dependabot PATCH and MINOR updates, and same-release pin
# corrections that verify against the upstream tag. Nothing else.
#
# WHY AUTO-MERGE IS SAFE HERE, AND WHERE ITS BOUNDARY IS
#
# The usual objection to auto-merge is that nothing read the change. That is a
# fair objection, and the answer here is not "we trust the ecosystem" — it is
# that THE GATE WALL IS THE REVIEWER, and on this repository the wall is
# unusually wide. Before anything is PUBLISHED, `deploy.yml` must pass:
#
#   - the full test suite, every gate with a negative AND a positive control,
#     so a gate that refuses everything cannot pass;
#   - build.py, which REFUSES rather than publishing bad output — colour
#     literals, unknown tokens, inline style or script, mark drift, unanchored
#     figures, dangling asset references;
#   - the four checkers: C-33 contact scan, content rules, the animation ledger
#     both directions, and contrast recomputed for BOTH themes;
#   - a determinism check: a second build must produce the same tree hash;
#   - axe-core and the CSP violation check in a real browser, on all five pages
#     IN BOTH THEMES, with a rendered-background witness proving each theme
#     actually rendered;
#   - the above-fold check, which refuses if anything in the first-paint
#     viewport starts hidden.
#
# WHERE THE WALL STANDS, stated precisely (defect D-63 was a claim wider than
# this): on a pull request only CodeQL runs. The wall above runs on `main`, in
# the deploy this workflow dispatches after the merge, and the deploy job
# publishes only if the build job passed. So a bump that breaks the wall lands
# on `main` and does NOT reach the site, and the failed run is the signal. A
# bump that breaks nothing has been checked more thoroughly than a human skim.
#
# THE BOUNDARY, stated plainly:
#
#   - MAJOR updates NEVER auto-merge. A major version is an intentional break,
#     and the gate wall answers "did anything I already check change behaviour",
#     not "is this the right dependency to be on". That second question is the
#     owner's and stays the owner's.
#   - A SHA-only bump (no semver update-type, the shape Dependabot produces for
#     a pinned Action whose version comment did not change) merges ONLY when
#     the new SHA is the commit the upstream tag named in the version comment
#     resolves to, checked against the upstream repository by API here and
#     now. That is a pin correction to the same release, and defect D-62 is
#     why they occur: two pins carried the annotated-tag object's SHA rather
#     than the commit's. Any SHA that does not resolve that way is HELD and
#     the reason printed, because a moved SHA under an unchanged version is
#     the supply-chain signal that pinning exists to surface.
#   - The wall only covers what it measures. It does not read a diff for
#     malicious code, and a supply-chain compromise that keeps every gate green
#     would pass. This is a two-ecosystem repository with pinned, mainstream
#     tooling and no runtime third-party resources (C-19), which is what makes
#     that residual risk small enough to accept — not any property of the wall.
#   - It merges. It does not deploy blind: `main`'s deploy runs the wall before
#     publishing.
#
# WHY THIS WORKFLOW WAITS FOR CHECKS ITSELF rather than `gh pr merge --auto`:
# `--auto` needs the repository's allow-auto-merge setting and a protected base
# branch with required checks. Neither exists on this repository, so the
# earlier version of this file could never have merged anything, and in fact
# never reached its merge step (D-63). Polling the PR's own check runs, minus
# this job, needs no repository setting and states exactly what it waited for.
#
# WHY IT DISPATCHES THE DEPLOY: a merge made with GITHUB_TOKEN does not create
# `push` workflow runs (GitHub's rule against recursive workflows), so without
# the dispatch a merged bump would never be built, gated, or published. The
# same rule is why `measure-live.yml` and `refresh-stats.yml` dispatch it
# (D-45, D-46), and `actions: write` is required for the dispatch (D-47).
#
# SECURITY: `pull_request_target` runs with write permissions against the BASE
# repository, so nothing from the PR may reach the shell as code. This workflow
# checks out nothing and executes nothing from the PR. The one PR-derived
# string it reads, the version comment beside the pin, is fetched as data by
# API, matched against a strict character class before use, and only ever
# used as a path segment in a further API call.
#
# If any of those conditions stop being true, this file should be deleted rather
# than adjusted.
#
# Refs, checked 2026-08-25 rather than recalled (doctrine rule 3):
#   dependabot/fetch-metadata  https://github.com/dependabot/fetch-metadata
#   Automating Dependabot with Actions
#   https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions
#   Triggering a workflow from a workflow (GITHUB_TOKEN does not trigger push)
#   https://docs.github.com/en/actions/using-workflows/triggering-a-workflow#triggering-a-workflow-from-a-workflow
#   Git refs and tag objects (annotated tags peel to a commit)
#   https://docs.github.com/en/rest/git/tags

name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read what kind of update this is
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide, and say why
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Every value below arrives through the environment, never
          # interpolated into the script body.
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          DEPS: ${{ steps.meta.outputs.dependency-names }}
          NEW_VERSION: ${{ steps.meta.outputs.new-version }}
        run: |
          set -euo pipefail
          verdict=hold
          reason="unclassified update; nothing merges without a stated reason"

          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor)
              verdict=merge
              reason="$UPDATE_TYPE"
              ;;
            version-update:semver-major)
              reason="MAJOR update held for the owner's review: $DEPS"
              ;;
            "")
              if [ "$ECOSYSTEM" != "github_actions" ]; then
                reason="no update-type and ecosystem is '$ECOSYSTEM'; only Actions pins are verified by tag"
              elif ! printf '%s' "$NEW_VERSION" | grep -Eq '^[0-9a-f]{40}$'; then
                reason="no update-type and new-version '$NEW_VERSION' is not a 40-hex commit SHA"
              else
                # Same-version SHA bump. Verify against upstream, one pin line
                # at a time: every changed workflow line that pins one of the
                # bumped dependencies at NEW_VERSION must carry a version
                # comment whose upstream tag peels to exactly NEW_VERSION.
                verified=0; failed=""
                files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
                          -q '.[].filename' | grep -E '^\.github/workflows/[A-Za-z0-9._-]+\.ya?ml$' || true)
                IFS=',' read -ra dep_list <<< "$DEPS"
                for f in $files; do
                  content=$(gh api "repos/$REPO/contents/$f?ref=$HEAD_SHA" \
                              -H "Accept: application/vnd.github.raw+json")
                  for dep in "${dep_list[@]}"; do
                    dep=$(printf '%s' "$dep" | tr -d ' ')
                    upstream=$(printf '%s' "$dep" | cut -d/ -f1,2)
                    while IFS= read -r line; do
                      [ -n "$line" ] || continue
                      tag=$(printf '%s' "$line" | sed -nE 's/.*#[[:space:]]*(v?[0-9][0-9A-Za-z._-]*)[[:space:]]*$/\1/p')
                      if [ -z "$tag" ]; then
                        failed="$failed; $f: $dep pinned without a version comment"; continue
                      fi
                      obj=$(gh api "repos/$upstream/git/ref/tags/$tag" -q '.object.type + " " + .object.sha' 2>/dev/null || echo "missing -")
                      type=${obj%% *}; sha=${obj##* }
                      if [ "$type" = tag ]; then
                        sha=$(gh api "repos/$upstream/git/tags/$sha" -q '.object.sha')
                      fi
                      if [ "$sha" = "$NEW_VERSION" ]; then
                        verified=$((verified + 1))
                        echo "verified: $upstream tag $tag -> $sha ($f)"
                      else
                        failed="$failed; $f: $upstream tag $tag resolves to '$sha', PR pins $NEW_VERSION"
                      fi
                    done <<< "$(printf '%s\n' "$content" | grep -F "$dep@$NEW_VERSION" || true)"
                  done
                done
                if [ "$verified" -gt 0 ] && [ -z "$failed" ]; then
                  verdict=merge
                  reason="same-release pin correction: $verified line(s) verified against the upstream tag"
                elif [ -z "$failed" ]; then
                  reason="no changed pin line matched $DEPS@$NEW_VERSION; nothing to verify"
                else
                  reason="SHA does not verify against the upstream tag${failed}"
                fi
              fi
              ;;
          esac

          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "reason=$reason"   >> "$GITHUB_OUTPUT"
          echo "$verdict: $reason"

      - name: Wait for every other check on this PR
        if: steps.decide.outputs.verdict == 'merge'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SELF: ${{ github.job }}
        run: |
          set -euo pipefail
          # 20 minutes, polled every 30 s. CodeQL on this repository takes
          # about a minute; the cap is for a stuck runner, not a slow one.
          for i in $(seq 1 40); do
            runs=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" --paginate \
                     -q ".check_runs[] | select(.name != \"$SELF\") | .status + \" \" + (.conclusion // \"-\") + \" \" + .name")
            # Status and conclusion come FIRST because check names carry spaces
            # ("Analyze (python)"); keyed on the name's position the loop never
            # saw a completed check and waited out its cap. Caught by dry run.
            total=$(printf '%s\n' "$runs" | grep -c . || true)
            if [ "$total" -gt 0 ]; then
              bad=$(printf '%s\n' "$runs" | awk '$1=="completed" && $2!="success" && $2!="skipped" && $2!="neutral"' || true)
              if [ -n "$bad" ]; then
                echo "held: a check failed"; printf '%s\n' "$bad"; exit 1
              fi
              pending=$(printf '%s\n' "$runs" | awk '$1!="completed"' | grep -c . || true)
              if [ "$pending" -eq 0 ]; then
                echo "every other check passed:"; printf '%s\n' "$runs"; exit 0
              fi
            fi
            sleep 30
          done
          echo "held: checks did not complete within 20 minutes"; exit 1

      - name: Merge, then dispatch the deploy that gates it
        if: steps.decide.outputs.verdict == 'merge'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          set -euo pipefail
          # D-65. Two faults on the first live run, 2026-08-25. (1) `main` moved
          # between the check wait and the merge, and GitHub refused with "Base
          # branch was modified. Review and try the merge again"; it recomputes
          # mergeability on its own schedule, so the merge is retried a few
          # times with a pause, and only that message is retried. (2) Nothing
          # is checked out here, so `gh workflow run` could not infer the
          # repository from git and failed AFTER the merge; `--repo` names it.
          merged=0
          for attempt in 1 2 3 4 5 6; do
            if out=$(gh pr merge --squash --delete-branch "$PR_URL" 2>&1); then
              merged=1; break
            fi
            echo "merge attempt $attempt: $out"
            case "$out" in
              *"Base branch was modified"*) sleep 20 ;;
              *) exit 1 ;;
            esac
          done
          [ "$merged" -eq 1 ] || { echo "held: base branch kept moving across 6 attempts"; exit 1; }
          echo "merged: $REASON"
          gh workflow run deploy.yml --ref main --repo "$REPO"
          echo "deploy dispatched: the gate wall runs on main before anything publishes"

      - name: Say plainly why an update is held
        if: steps.decide.outputs.verdict != 'merge'
        env:
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          echo "HELD: $REASON"
          echo "The gate wall answers 'did behaviour change', not 'is this the"
          echo "right dependency to be on'. The second question is the owner's."
