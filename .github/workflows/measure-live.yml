# Measure the PUBLISHED site and publish what was measured.  P3.5 / D4.
#
# WHY THIS EXISTS, SEPARATELY FROM THE DEPLOY JOB
# The deploy workflow measures a `python -m http.server` copy of _site. That is
# the right place for gates that must BLOCK a bad deploy (axe, CSP, validator —
# all environment-independent). It is the wrong place for PERFORMANCE figures:
#
#   published origin : Content-Encoding: gzip · Cache-Control: max-age=600
#   CI test server   : neither
#
# So `uses-text-compression` and `uses-long-cache-ttl` deductions measured there
# describe the test server, not the site. Publishing them as the site's
# performance would break the standing principle this build adopted:
#
#   "any figure destined for /audit is measured in the environment that
#    publishes it."
#
# This job measures https://mohdsaifhussain.github.io — the real origin, real
# headers, real CDN — and commits the result, which triggers a rebuild so
# /audit renders it. The figures therefore describe the PREVIOUS deploy, which
# is why every value carries an "as of" stamp rather than implying "now".

name: Measure the live site

on:
  workflow_dispatch:
  schedule:
    - cron: "40 4 * * 1"        # Mondays, after the stats refresh

# D-47: `actions: write` is REQUIRED, not decorative. Declaring a permissions
# block at all sets every scope NOT listed here to `none` — so with only
# `contents: write`, the D-45 fix below (`gh workflow run`, which is
# POST /repos/{owner}/{repo}/actions/workflows/{id}/dispatches) would have
# returned 403 the first time it ran. The D-45 fix landed 10 minutes after the
# last measurement and had never once executed, so nothing had exercised it.
#
# Sources, checked 2026-08-09 rather than recalled (doctrine rule 3):
#   "Assigning permissions to jobs" — if you specify the permissions key, all
#   unspecified scopes are set to no access.
#   https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
#   "Create a workflow dispatch event" — requires the actions:write permission.
#   https://docs.github.com/en/rest/actions/workflows#create-a-workflow-dispatch-event
permissions:
  contents: write
  actions: write

concurrency:
  group: measure-live
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Install
        run: |
          npm ci
          python -m pip install -r requirements.txt
          # Defect D-48: axe now has to run here too, so the browser tooling
          # this job needs is installed here as well. Same pinned file the
          # deploy job uses, so both run the same version (D-23's lesson).
          python -m pip install -r requirements-audit.txt
          python -m playwright install --with-deps chromium

      - name: Lighthouse against the LIVE origin, both profiles
        run: |
          BASE=https://mohdsaifhussain.github.io
          npx --yes @lhci/cli@0.15.1 collect \
            --url=$BASE/ --url=$BASE/projects/ --url=$BASE/experience/ \
            --url=$BASE/certifications/ --url=$BASE/audit/ \
            --settings.formFactor=mobile --settings.screenEmulation.mobile=true \
            --numberOfRuns=3 || true
          npx --yes @lhci/cli@0.15.1 collect \
            --url=$BASE/ --url=$BASE/projects/ --url=$BASE/experience/ \
            --url=$BASE/certifications/ --url=$BASE/audit/ \
            --settings.formFactor=desktop --settings.screenEmulation.disabled=true \
            --settings.preset=desktop --numberOfRuns=3 --additive || true
          echo "lhr reports: $(ls .lighthouseci/lhr-*.json 2>/dev/null | wc -l)  (expect 30 = 5 pages x 2 profiles x 3 runs)"

      - name: Validator against the live origin
        run: |
          BASE=https://mohdsaifhussain.github.io
          java -jar "$(npm root)/vnu-jar/build/dist/vnu.jar" --format json \
            --exit-zero-always $BASE/ $BASE/projects/ $BASE/experience/ \
            $BASE/certifications/ $BASE/audit/ > vnu.json 2> vnu.stderr || true
          if [ ! -s vnu.json ] || ! python -c "import json;json.load(open('vnu.json'))" 2>/dev/null; then
            mv vnu.stderr vnu.json
          fi

      # --- Defect D-48 -----------------------------------------------------
      # A1.2 (axe) and the eight A2 charter-check rows rendered "— AT DEPLOY"
      # for the whole of v1.0.0. Nothing produced them: write_audit.py accepted
      # --axe but no workflow passed it, and the eight A2 keys had no writer
      # anywhere. The page meanwhile stated that such cells are "MEASURED BY CI
      # AT PUBLISH TIME".
      #
      # They are produced HERE, not in the deploy job, because audit.json has
      # exactly one writer (D-42: two writers raced and a test-server figure
      # overwrote a real one). The deploy job still runs these same gates as
      # BLOCKING gates; this job runs them again to record what they said.
      #
      # These describe the CHECKED-OUT COMMIT, not the published origin — a
      # different subject from the Lighthouse figures above, which is why
      # gate_status.py records the SHA and /audit labels the two separately.
      - name: Build the site the gates and axe run against
        run: python build.py

      - name: Prove the browser audit can fail
        run: python tools/browser_audit.py --root _site --selftest

      - name: C-06 — axe-core against the built site
        run: python tools/browser_audit.py --root _site --json-out axe.json

      - name: Charter-check gates — record what each one actually said
        run: |
          python tools/gate_status.py --selftest
          python tools/gate_status.py --json-out gates.json

      - name: Write measured results
        run: |
          python tools/write_audit.py --selftest
          python tools/write_audit.py --lighthouse .lighthouseci --vnu vnu.json \
            --axe axe.json --gates gates.json \
            --measured-against "https://mohdsaifhussain.github.io (published origin)"

      # Same single-path guard as the stats refresh: the unreviewed surface is
      # exactly one file of machine-measured values, no wider.
      - name: Single-path guard
        run: |
          git add -f data/generated/audit.json
          CHANGED=$(git status --porcelain | awk '{print $2}')
          for f in $CHANGED; do
            if [ "$f" != "data/generated/audit.json" ]; then
              echo "REASON=OUT_OF_SCOPE_CHANGE  $f"; exit 1
            fi
          done

      - name: Commit the measurement
        run: |
          if git diff --cached --quiet; then echo "unchanged"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: measured against the published origin

          Lighthouse and the W3C validator run against
          https://mohdsaifhussain.github.io with its real headers — gzip and
          cache-control — rather than a bare CI test server."
          git push
          echo "PUBLISH_NEEDED=true" >> "$GITHUB_ENV"

      # Defect D-45: a push made with the default GITHUB_TOKEN does NOT trigger
      # other workflows — GitHub's own guard against recursive runs. So the
      # measurement committed numbers that would never deploy, and /audit would
      # have lagged one measurement behind SILENTLY AND FOREVER, with the page
      # still carrying an "as of" stamp that looked current.
      #
      # Found by the release verification comparing SERVED bytes against BUILT
      # bytes — neither alone would have shown it.
      #
      # Dispatching deploy explicitly is the fix that needs no new secret.
      - name: Publish the measurement
        if: env.PUBLISH_NEEDED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yml --ref main
          echo "deploy dispatched so the measurement actually reaches /audit"
