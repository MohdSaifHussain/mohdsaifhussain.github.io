# Build and publish to GitHub Pages.  P3.1 / D6.
#
# Pages Source is set to "GitHub Actions" (director, 2026-08-06). No suggested
# workflow template was accepted — this is the only workflow in the repo.
#
# Action versions resolved from their current releases on 2026-08-06, not from
# memory (doctrine rule 3):
#   actions/checkout v7.0.1 · actions/setup-python v7.0.0
#   actions/configure-pages v6.0.0 · actions/upload-pages-artifact v5.0.0
#   actions/deploy-pages v5.0.0
#
# The subset woff2 files are COMMITTED, so this build is hermetic: it never
# reaches the network for fonts, and the exact bytes served are inspectable in
# the repo (C-32). tools/subset_fonts.py is a maintenance tool, not a CI step.
#
# The gates run BEFORE the build, and the build refuses rather than publishing
# bad output. A red job here means nothing is deployed — that is the point.

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; do not cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Gate selftest — every check must be able to refuse
        run: python build.py --selftest

      - name: Test suite
        run: python -m pytest -q

      - name: Build
        run: python build.py

      # Run AFTER the build: both checkers inspect rendered output as well as
      # source, and each proves its own controls can fail before asserting the
      # repo is clean.
      - name: C-33 — contact-capable addresses and phone numbers
        run: |
          python tools/check_c33.py --selftest
          python tools/check_c33.py

      - name: Content rules — em-dash scope, typed counts, inline markup
        run: |
          python tools/check_content.py --selftest
          python tools/check_content.py

      - name: C-12 / C-15 — shipped motion matches the declared list
        run: |
          python tools/check_animations.py --selftest
          python tools/check_animations.py

      - name: C-09 — contrast recomputed from tokens
        run: |
          python tools/check_contrast.py --selftest
          python tools/check_contrast.py

      - name: Determinism — a second build must produce the same tree hash
        run: |
          FIRST=$(python build.py | grep 'content hash')
          SECOND=$(python build.py | grep 'content hash')
          echo "1: $FIRST"
          echo "2: $SECOND"
          test "$FIRST" = "$SECOND"

      # --- Real-browser audit (P3.4 / D2). Discharges O-10. -----------------
      # Runs BEFORE deploy, against the built _site, so an axe violation or a
      # CSP error blocks publication instead of being found afterwards. The
      # builder has no local browser by the director's ruling: a figure measured
      # there is not evidence about the published site.
      - uses: actions/setup-node@v7.0.0        # current release, checked 2026-08-06
        with:
          node-version: '22'

      - name: Install audit tooling (CI only)
        run: |
          npm ci || npm install
          python -m pip install -r requirements-audit.txt
          python -m playwright install --with-deps chromium

      # Selftest FIRST: a zero-violation audit is the result that most deserves
      # suspicion, because "axe found nothing" and "axe never ran" print the
      # same. This proves both detectors can fail before the real run claims
      # they did not.
      - name: Prove the browser audit can fail
        run: python tools/browser_audit.py --root _site --selftest

      - name: C-06 / C-18 — axe-core and CSP violations, in a real browser
        run: python tools/browser_audit.py --root _site --json-out axe.json

      # --- Measurement pass (P3.5). Two-pass by necessity: /audit reports on
      # the site it is part of, so the site must be built, measured, and then
      # rebuilt with the measurements in it. -------------------------------
      - name: C-23 — W3C Nu validator
        run: |
          java -jar "$(npm root)/vnu-jar/build/dist/vnu.jar" \
            --format json --exit-zero-always --skip-non-html _site \
            > vnu.json 2> vnu.stderr || true
          # vnu writes its JSON to stderr; normalise whichever carries it.
          if [ ! -s vnu.json ] || ! python -c "import json;json.load(open('vnu.json'))" 2>/dev/null; then
            mv vnu.stderr vnu.json
          fi
          python -c "import json;d=json.load(open('vnu.json'));e=[m for m in d.get('messages',[]) if m.get('type')=='error'];print(f'validator errors: {len(e)}');[print('  ',m.get('message')) for m in e[:10]]"

      - name: C-01 / C-02 / C-03 — Lighthouse, all five pages, both profiles
        run: |
          python -m http.server 8765 --directory _site &
          sleep 2
          # Discriminator for the robots-txt audit failure: does the SERVER
          # serve robots.txt, or is the failure inside the page? If this is
          # 200 and Lighthouse still "cannot download" it, the block is
          # in-page — i.e. our own connect-src 'none' refusing the probe, not
          # a defect a real crawler would ever encounter.
          echo "robots.txt over HTTP: $(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/robots.txt)"
          echo "sitemap.xml over HTTP: $(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/sitemap.xml)"
          npx --yes @lhci/cli@0.15.1 collect \
            --url=http://127.0.0.1:8765/ \
            --url=http://127.0.0.1:8765/projects/ \
            --url=http://127.0.0.1:8765/experience/ \
            --url=http://127.0.0.1:8765/certifications/ \
            --url=http://127.0.0.1:8765/audit/ \
            --settings.formFactor=mobile --settings.screenEmulation.mobile=true \
            --numberOfRuns=1 || true
          npx --yes @lhci/cli@0.15.1 collect \
            --url=http://127.0.0.1:8765/ \
            --url=http://127.0.0.1:8765/projects/ \
            --url=http://127.0.0.1:8765/experience/ \
            --url=http://127.0.0.1:8765/certifications/ \
            --url=http://127.0.0.1:8765/audit/ \
            --settings.formFactor=desktop --settings.screenEmulation.disabled=true \
            --settings.preset=desktop --numberOfRuns=1 --additive || true
          # --additive is LOAD-BEARING (defect D-41). Without it this second
          # collect wipes .lighthouseci and erases the mobile results, so the
          # published figure would be desktop-only while C-01 requires BOTH
          # profiles on every page — a claim wider than the measurement.
          echo "lhr reports collected: $(ls .lighthouseci/lhr-*.json 2>/dev/null | wc -l)  (expect 10 = 5 pages x 2 profiles)"

      # The connect-src diagnostic that lived here has been REMOVED.
      # It proved its point (see D-40 and DECISIONS): with connect-src 'self'
      # on a throwaway copy, SEO measured 100 and robots-txt scored 1; with the
      # shipped 'none' it is 92. Causation established, experiment retired.
      #
      # It is removed rather than kept because `lhci collect` WIPES
      # .lighthouseci on every invocation, so the second collect destroyed the
      # real measurements and a false "? / ? / ? / 100" reached the live /audit.
      # A diagnostic that can corrupt the published measurement does not stay in
      # the pipeline once it has answered its question.

      # Scores publish EXACTLY as measured (requirement 3.2). No re-run for a
      # better number: `|| true` above exists so a low score still reaches
      # /audit, never so a bad run can be retried away.
      - name: Write measured results into audit.json
        run: |
          python tools/write_audit.py --selftest
          python tools/write_audit.py --lighthouse .lighthouseci --vnu vnu.json --axe axe.json

      - name: Rebuild so /audit publishes what was measured
        run: python build.py

      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.0
