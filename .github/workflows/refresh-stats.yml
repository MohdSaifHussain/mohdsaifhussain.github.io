# Weekly stats snapshot refresh + evidence-link resolvability check.
#
# Approved in P3.2 Q1 (weekly cadence) and extended by the director's ruling of
# 2026-08-06: resolvability checking lives HERE, in the networked job, not in
# the build. The build stays hermetic (STEP-04 requirement 3.2), and a link that
# dies later is caught by machinery within a week rather than by the owner's eye.
#
# THE SINGLE-PATH GUARD (director's added condition, P3.2 Q1):
# "the automation must be constrained to that single path — a bot commit
#  touching any other file fails rather than lands — so the unreviewed surface
#  is exactly one snapshot of public data, no wider."
# Implemented below by diffing the working tree against that one path BEFORE
# committing, and failing the job if anything else changed. The check runs
# before the commit, not after, so a wider change never lands at all.
#
# The bot author is github-actions[bot]@users.noreply.github.com, already exempt
# under charter Amendment 1 item (1). No further amendment is required.

name: Refresh stats snapshot

on:
  schedule:
    - cron: "17 4 * * 1"        # Mondays, 04:17 UTC
  workflow_dispatch:

# `actions: write` is required for the D-46 dispatch step at the end of this
# job. Declaring a permissions block sets every scope not listed here to `none`,
# so omitting it makes `gh workflow run` fail with 403 (D-47, the same mistake
# found in measure-live.yml).
permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'

      - name: Fetch anchors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/fetch_stats.py

      - name: Verify every evidence link resolves
        run: python tools/fetch_stats.py --verify-links

      - name: Single-path guard — refuse to commit anything but the snapshot
        run: |
          CHANGED=$(git status --porcelain | awk '{print $2}')
          echo "changed files:"; echo "$CHANGED"
          for f in $CHANGED; do
            if [ "$f" != "data/generated/github.json" ]; then
              echo "REASON=OUT_OF_SCOPE_CHANGE  $f"
              echo "The scheduled job may only modify data/generated/github.json."
              exit 1
            fi
          done

      - name: Commit if the snapshot changed
        run: |
          if git diff --quiet -- data/generated/github.json; then
            echo "snapshot unchanged; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/generated/github.json
          git commit -m "chore: weekly stats snapshot refresh

          Anchors re-fetched and every evidence link verified to resolve.
          Constrained to data/generated/github.json by the single-path guard."
          git push
          echo "PUBLISH_NEEDED=true" >> "$GITHUB_ENV"

      # D-46: this job had the D-45 defect and nobody looked. D-45 was found in
      # measure-live.yml — a push made with the default GITHUB_TOKEN does not
      # trigger other workflows — and the fix was applied THERE and only there.
      # This job pushes with the same token in the same way, so every weekly
      # snapshot would have landed in the repository and never reached the site.
      #
      # The failure would have been invisible: the rendered "AS OF" stamp stays
      # consistent with the stale data it is rendering, so no visitor sees a
      # false claim — the refresh simply stops meaning anything, and the day an
      # anchor actually moves the site shows the old one with no signal.
      #
      # The lesson recorded: fixing a defect in one instance of a pattern is not
      # fixing the defect. The sibling job is part of the blast radius.
      - name: Publish the refreshed snapshot
        if: env.PUBLISH_NEEDED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yml --ref main
          echo "deploy dispatched so the snapshot actually reaches the site"
